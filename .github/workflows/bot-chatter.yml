name: Bot chatter
on:
  schedule:
    - cron: "*/30 8-17 * * 1-5"
  workflow_dispatch:
jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run a conversation
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHATTER_CHANNEL_ID: ${{ secrets.CHATTER_CHANNEL_ID }}
          CONVO_SET: hr
          BOT_A_NAME: HR Bot (demo)
          BOT_B_NAME: Employee Bot (demo)
          DELAY_MIN: "30"
          DELAY_MAX: "120"
          START_PROBABILITY: "0.3"
        run: python chatter.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
